<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment #7 (Forms)</title>
</head>
<body>
  <h1><u><em>SMIT North Karachi Campus Batch<sup>-17</sup></em></u></h1>

  <!-- Main Form Start -->
  <form>

    <!-- Assignment Fieldset -->
    <fieldset style="width:650px;">
      <legend><strong><em>Assignment #7 <sup>(Forms)</sup></em></strong></legend>

      <!-- Personal Information -->
      <fieldset style="width:620px;">
        <legend><em>Personal Information</em></legend>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name">
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter a strong password">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="your@gmail.com">
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="+923001234567">
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="picture">Portfolio Picture:</label><br>
        <input type="file" id="picture" name="picture">
      </fieldset>

      <!-- Education and Skills -->
      <fieldset style="width:620px;">
        <legend><em>Education and Skills</em></legend>

        <label>Technical Skills:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>
        <br><br>

        <label for="experience">Years of Experience:</label><br>
        <input type="number" id="experience" name="experience" min="0" max="50">
      </fieldset>

      <!-- Preferences -->
      <fieldset style="width:620px;">
        <legend><em>Preferences</em></legend>

        <label for="color">Favourite Color:</label><br>
        <input type="color" id="color" name="color">
        <br><br>

        <label for="volume">Notification Volume:</label><br>
        <input type="range" id="volume" name="volume" min="0" max="100">
        <br><br>

        <label for="search">Search Something:</label><br>
        <input type="search" id="search" name="search" placeholder="Type here...">
        <br><br>

        <label for="web">Your Website:</label><br>
        <input type="url" id="web" name="web" placeholder="https://example.com">
      </fieldset>

      <br>
      <input type="submit" value="Submit Form">
    </fieldset>
  </form>
  <!-- Main Form End -->

</body>
</html>
